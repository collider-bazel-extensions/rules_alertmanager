    app.kubernetes.io/version: "v0.34.2"
    app.kubernetes.io/managed-by: Helm
  namespace: alertmanager
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: http
      protocol: TCP
      name: http
